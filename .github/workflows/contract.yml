name: player-contract

on: [push, pull_request]

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

# A pull request from a fork runs on a GitHub-hosted runner, never on the self-hosted
# one: this repo is public, and fork code must not reach that machine (AUD-8001).
# The same expression guards nomercy-player-core-kmp and nomercy-music-player-kmp CI.
jobs:
  contract:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v7
        with:
          path: testing/nomercy-player-conformance

      # The generator reads the trio's TypeScript. Without the packages it has
      # nothing to extract from. The three packages live in nomercy-player-web,
      # which is public and the subject of the run.
      - uses: actions/checkout@v7
        with:
          repository: NoMercy-Entertainment/nomercy-player-web
          path: packages/player-web/nomercy-player-web
          fetch-depth: 0

      # The Swift facade extractor reads the shipped facades out of the native
      # repos. Same reasoning as the three above: public, and the subject of the
      # run rather than someone's private layout.
      - uses: actions/checkout@v7
        with:
          repository: NoMercy-Entertainment/nomercy-video-player-kmp
          path: packages/player-kmp/nomercy-video-player-kmp
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: NoMercy-Entertainment/nomercy-music-player-kmp
          path: packages/player-kmp/nomercy-music-player-kmp
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        working-directory: testing/nomercy-player-conformance
        run: yarn install --immutable

      - name: Test
        working-directory: testing/nomercy-player-conformance
        run: yarn test

      # Drift is the daily gate: the committed contract must still match what the
      # generator produces. It also prints whether the surface is released, which
      # needs the tags it compares against — hence fetch-depth: 0 above.
      - name: Drift
        working-directory: testing/nomercy-player-conformance
        run: yarn run check

      # Released-ness is a publish gate, not a push gate. It is true on every
      # push where anything at all is unpublished, so gating every push on it
      # would have been silenced within a week. Here it bites: a tag means
      # something is being released, and the contract has to describe it.
      - name: Released surface
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: testing/nomercy-player-conformance
        run: yarn run check:release

  # The parity grader reads the contract above and the KMP trio's ABI dumps.
  # Its unit tests use fixtures, so the repo alone is enough here.
  parity:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v7
        with:
          path: testing/nomercy-player-conformance

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        working-directory: testing/nomercy-player-conformance/parity
        run: yarn install --immutable

      - name: Typecheck
        working-directory: testing/nomercy-player-conformance/parity
        run: yarn tsc --noEmit

      - name: Test
        working-directory: testing/nomercy-player-conformance/parity
        run: yarn test

  # The scenario harness drives the real trio, so the trio has to be here and
  # built. The relative paths mirror the monorepo, which is what the link: deps
  # in scenarios/package.json expect (link:, because the trio's own workspace:
  # ranges only resolve inside nomercy-player-web). It reads the contract from ../contract.
  scenarios:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v7
        with:
          path: testing/nomercy-player-conformance

      - uses: actions/checkout@v7
        with:
          repository: NoMercy-Entertainment/nomercy-player-web
          path: packages/player-web/nomercy-player-web

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Build the trio the harness drives
        working-directory: packages/player-web/nomercy-player-web
        run: yarn install && yarn run build

      - name: Install
        working-directory: testing/nomercy-player-conformance/scenarios
        # The lockfile cannot pin the freshly built trio, so --immutable would always fail.
        # Yarn turns --immutable on by itself when CI is set, so turn it off here.
        run: yarn install --no-immutable

      - name: Typecheck
        working-directory: testing/nomercy-player-conformance/scenarios
        run: yarn tsc --noEmit

      - name: Lint
        working-directory: testing/nomercy-player-conformance/scenarios
        run: yarn run lint

      # Runs the whole scenario set against both real players, plus the planted
      # drift proof that shows a failure is actually reported.
      - name: Scenarios
        working-directory: testing/nomercy-player-conformance/scenarios
        run: yarn test
