name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools/player-scenarios

      # The harness drives the real trio, so the trio has to be here. These are
      # the three packages under test, all public — checking them out is the
      # subject of the run, not a dependency on anyone's private layout. The
      # relative paths mirror the monorepo, which is what the file: deps expect.
      - uses: actions/checkout@v6
        with:
          repository: NoMercy-Entertainment/nomercy-player-core
          path: packages/nomercy-player-core
      - uses: actions/checkout@v6
        with:
          repository: NoMercy-Entertainment/nomercy-video-player
          path: packages/nomercy-video-player
      - uses: actions/checkout@v6
        with:
          repository: NoMercy-Entertainment/nomercy-music-player
          path: packages/nomercy-music-player

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build the trio the harness drives
        run: |
          for package in nomercy-player-core nomercy-video-player nomercy-music-player; do
            npm ci --prefix "packages/$package" || npm install --prefix "packages/$package"
            npm run build --prefix "packages/$package"
          done

      - name: Install
        working-directory: tools/player-scenarios
        run: npm install

      - name: Typecheck
        working-directory: tools/player-scenarios
        run: npx tsc --noEmit

      - name: Lint
        working-directory: tools/player-scenarios
        run: npm run lint

      # Runs the whole scenario set against both real players, plus the planted
      # drift proof that shows a failure is actually reported.
      - name: Scenarios
        working-directory: tools/player-scenarios
        run: npm test
